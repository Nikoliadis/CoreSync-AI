# Reverse proxy in front of the API.
#
# In Azure, Front Door terminates TLS and this sits inside the App Service container;
# locally it fronts the compose stack. Either way it is the outermost hop, so the limits
# here are the volumetric ones — per-user fairness is enforced in the application, where
# identity is known (docs/04 §3).

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Request id flows through to the API so a log line in nginx and a log line in the
    # application can be joined for one request.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rid=$request_id rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;          # do not advertise the version

    gzip  on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain application/xml;

    # 15 MB matches the progress-photo upload limit. Photo bytes go direct to blob
    # storage, so nothing this large should reach the API — the cap is a backstop.
    client_max_body_size 15m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Volumetric limiting only. Keyed on IP because nginx cannot see the authenticated
    # user; the application layer is authoritative for anything identity-dependent.
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=1r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=api_conn:10m;

    upstream coresync_api {
        server api:8000;
        keepalive 32;
    }

    # Plain HTTP exists only to redirect. HSTS is meaningless if the first hop is
    # answered over cleartext.
    server {
        listen 80;
        server_name _;

        location /health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.coresync.ai;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # HSTS with preload (docs/11 §3). Set here rather than in the application so it
        # is present even on responses the application never produced, such as a 502.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        limit_conn api_conn 50;

        # Credential endpoints get their own bucket. The application also throttles these
        # per IP+email, which nginx cannot do — it cannot read the body.
        location ~ ^/v1/auth/(login|register|password/forgot)$ {
            limit_req zone=api_auth burst=5 nodelay;
            proxy_pass http://coresync_api;
            include /etc/nginx/proxy_params.conf;
        }

        location / {
            limit_req zone=api_general burst=40 nodelay;
            proxy_pass http://coresync_api;
            include /etc/nginx/proxy_params.conf;
        }

        # Long-lived SSE stream for the AI coach: buffering it would defeat streaming.
        location /v1/ai/ {
            proxy_pass http://coresync_api;
            include /etc/nginx/proxy_params.conf;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            chunked_transfer_encoding on;
        }

        location = /health {
            access_log off;
            proxy_pass http://coresync_api/v1/health;
            include /etc/nginx/proxy_params.conf;
        }
    }
}
