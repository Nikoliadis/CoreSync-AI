# Shared proxy headers.
#
# Included by every location so no route can accidentally drop the forwarded client
# address — the application rate-limits on it, and getting it wrong means limiting the
# proxy instead of the caller.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
# Generated by nginx when absent, preserved when the client supplies one, so a request
# can be traced end to end.
proxy_set_header X-Request-Id      $request_id;
proxy_set_header Connection        "";

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# Never let a proxy layer cache an authenticated response.
proxy_no_cache 1;
proxy_cache_bypass 1;
