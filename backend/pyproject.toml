[project]
name = "coresync-api"
version = "0.1.0"
description = "CoreSync API — workout, nutrition and progress tracking with an AI coach"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    # pgvector column type for the AI retrieval corpus (docs/10 §3.2).
    "pgvector>=0.3",
    "alembic>=1.14",
    "redis>=5.2",
    "celery>=5.4",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.27",
    "aiosmtplib>=3.0",
    "jinja2>=3.1",
    "structlog>=24.4",
    "orjson>=3.10",
    "python-multipart>=0.0.17",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "hypothesis>=6.115",
    "testcontainers[postgres]>=4.8",
    "polyfactory>=2.18",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "types-passlib",
    # Used by the security job in CI. Declared here so `uv run pip-audit` resolves.
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coresync"]

# ---------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "A",           # builtins shadowing
    "C4",          # comprehensions
    "DTZ",         # naive datetimes — every timestamp in this system is tz-aware
    "S",           # bandit
    "ASYNC",       # blocking calls in async code
    "RUF",
]
ignore = [
    "S101",        # assert — used in tests
    "B008",        # function call in default arg — this is how FastAPI Depends works
]

# Greek letters are not typos here. This is a Greek-market product: food names, test
# fixtures and the comments explaining them are all legitimately Greek, and RUF001/2/3
# flag every one of them as a possible Latin lookalike.
#
# Listed as allowed confusables rather than switching the rules off, because the rules
# also catch the confusable that *is* always a mistake — an en-dash or a non-breaking
# space that a word processor slipped into source. That check is worth keeping.
allowed-confusables = [
    "α", "β", "γ", "δ", "ε", "ζ", "η", "θ", "ι", "κ", "λ", "μ",
    "ν", "ξ", "ο", "π", "ρ", "ς", "σ", "τ", "υ", "φ", "χ", "ψ", "ω",
    "Α", "Β", "Γ", "Δ", "Ε", "Ζ", "Η", "Θ", "Ι", "Κ", "Λ", "Μ",
    "Ν", "Ξ", "Ο", "Π", "Ρ", "Σ", "Τ", "Υ", "Φ", "Χ", "Ψ", "Ω",
    "ά", "έ", "ή", "ί", "ό", "ύ", "ώ", "ϊ", "ϋ", "ΐ", "ΰ",
    "Ά", "Έ", "Ή", "Ί", "Ό", "Ύ", "Ώ",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]          # hardcoded test credentials are fine
"migrations/*" = ["E501", "N999"]
# The catalog is a data table, one exercise per line. Wrapping the rows would make the
# library unreadable in a diff, which is the whole point of the tabular form.
"src/coresync/infrastructure/seed/exercises.py" = ["E501"]
# A data table, one food per line, same reasoning as the exercise catalog above.
# Greek characters no longer need an ignore here — see `allowed-confusables`.
"src/coresync/infrastructure/seed/foods.py" = ["E501"]
# `PgUUID` is the conventional alias for postgresql.UUID and reads better than the
# alternative of shadowing the stdlib name.
"src/coresync/infrastructure/database/models/*" = ["N811"]
# S105 fires on field names and defaults like `token_type = "Bearer"`, which are
# protocol constants rather than credentials.
"src/coresync/presentation/schemas/*" = ["S105"]
"src/coresync/infrastructure/external/oidc.py" = ["S105"]

# ---------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# The domain and application layers hold the business rules, so they carry the
# strictest checking. Infrastructure deals with untyped third parties.
[[tool.mypy.overrides]]
module = ["coresync.domain.*", "coresync.application.*", "coresync.core.*"]
disallow_untyped_defs = true
disallow_any_generics = true
strict_equality = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["testcontainers.*", "argon2.*", "celery.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"
markers = [
    "integration: requires a real database",
    "slow: takes more than a second",
]
filterwarnings = ["error", "ignore::DeprecationWarning:passlib.*"]

[tool.coverage.run]
source = ["src/coresync"]
omit = ["*/migrations/*", "*/tests/*"]
# Measure with sys.monitoring rather than the legacy C trace function.
#
# SQLAlchemy's async layer bridges to sync DBAPI code through greenlets, and the trace
# function does not follow those stack switches: every repository and use case that runs
# inside a database call is reported as far less covered than it is. The gap was 10
# points of total coverage — 77% against 87% for the same 575 passing tests, purely from
# the measurement core — which is what had been failing CI's 80% gate while the suite was
# green locally. Requires Python 3.12+, which `requires-python` already guarantees.
core = "sysmon"

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

# ---------------------------------------------------------------------- import-linter
# The architecture is enforced here, not by good intentions. See docs/05.
[tool.importlinter]
root_package = "coresync"
# Required for the "framework-free" contracts below, which name third-party packages
# (fastapi, sqlalchemy, ...) as forbidden imports.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture layers"
type = "layers"
layers = [
    "coresync.presentation",
    "coresync.application",
    "coresync.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is framework-free"
type = "forbidden"
source_modules = ["coresync.domain"]
forbidden_modules = [
    "fastapi", "sqlalchemy", "redis", "httpx", "celery", "azure", "alembic", "jwt", "argon2",
]

[[tool.importlinter.contracts]]
name = "Application does not depend on concrete infrastructure"
type = "forbidden"
source_modules = ["coresync.application"]
forbidden_modules = ["coresync.infrastructure", "fastapi", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "Domain modules are independent"
type = "independence"
# `workout` must not reach into `catalog`: a logged set knows the numbers it recorded,
# which is all record detection needs. Coupling them would make the catalog — the most
# cacheable data in the system — a dependency of the hottest write path.
modules = [
    "coresync.domain.identity",
    "coresync.domain.profile",
    "coresync.domain.catalog",
    "coresync.domain.workout",
]
