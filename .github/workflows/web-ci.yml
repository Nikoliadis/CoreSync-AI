name: Web CI

# Scoped to the frontend so a backend-only change does not spend CI minutes here, and
# to the workflow itself so a change to these steps is exercised by the change that
# makes it.
on:
  pull_request:
    paths: ["frontend/**", ".github/workflows/web-ci.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/web-ci.yml"]

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  WORKING_DIR: frontend
  NODE_VERSION: "22"

jobs:
  quality:
    name: Lint, types & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `ci` rather than `install`: it installs exactly the lockfile and fails if
      # package.json and the lock have drifted, which is the point of committing one.
      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  accessibility:
    name: Accessibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

      - name: Install Chromium
        # Playwright pins a browser build matched to its own version, which is why
        # this is not @axe-core/cli: that pairs the system Chrome with a separately
        # versioned chromedriver and breaks whenever the two drift apart.
        run: npx playwright install chromium --with-deps

      - name: axe-core + keyboard checks
        # Playwright starts the production server itself (see playwright.config.ts).
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7
